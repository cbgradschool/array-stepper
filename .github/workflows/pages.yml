name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The build does not receive permission to publish or modify repository files.
permissions:
  contents: read

# Finish an active deployment before starting the next one.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check types
        run: npm run check

      - name: Test Python recording and view rules
        run: npm test

      - name: Install Chromium and its system dependencies
        run: npx playwright install --with-deps chromium

      # Playwright's webServer command runs npm run build, including the local
      # Pyodide copy. Upload that exact tested dist/, without rebuilding it.
      - name: Build and test the production site
        run: npm run test:e2e

      - name: Upload the tested site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    name: Publish site
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Deploy the site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
